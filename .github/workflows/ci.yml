name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: better-sqlite3 is not needed for the test suite (it
      # uses node:sqlite) and skipping native builds keeps CI fast and hermetic.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck (core, main, preload, renderer, tools)
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Build main + preload
        run: npm run build:main

      - name: Build owner tools (scripts only on Linux)
        run: npm run build:owner-tools

      - name: Check no private key material is present
        run: |
          set -e
          if git ls-files | grep -Ei '(\.pem$|\.key$|\.pfx$|owner-keys/|private-keys/)'; then
            echo "::error::Private key material must never be committed."
            exit 1
          fi
          if grep -rIl --exclude-dir=node_modules --exclude-dir=.git "BEGIN.*PRIVATE KEY" .; then
            echo "::error::A private key was found in the repository."
            exit 1
          fi
          echo "No key material tracked."

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: merqo-build-linux
          path: |
            dist/main
            dist/preload
            dist/renderer
            dist/tools
          retention-days: 7
